name: Triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Label requests for new plugins
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if printf '%s\n' "$TITLE" | grep -qi "new plugin"; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label plugin-request
          fi
