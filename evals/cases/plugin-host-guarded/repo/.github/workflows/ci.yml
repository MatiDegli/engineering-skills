name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/check_docstrings.py && python3 -m unittest discover -s tests -v
      - name: Baseline entries come in a change of their own
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: python3 tools/check_docstrings.py --base "origin/$BASE"
