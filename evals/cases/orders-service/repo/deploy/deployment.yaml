apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: registry.example.com/orders-service:main
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-service
                  key: database-url
            - name: SHOP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orders-service
                  key: shop-api-key
            - name: SMTP_HOST
              value: smtp.internal.example.com
